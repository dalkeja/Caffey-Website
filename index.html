document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rif;font-weight:500;font-size:clamp(38px,6.2vw,76px);line-height:1.02;letter-spacing:-0.01em;margin:0;max-width:15ch;text-transform:uppercase;text-wrap:balance\">Classic American character. Modern driving confidence.<\u002Fh1>\n        <p style=\"font-size:20px;line-height:1.55;color:#c3bdb5;max-width:58ch;margin:28px 0 40px\">We restore, modernize and improve classic American cars and trucks — vehicles that look right, work properly, and are meant to be driven.<\u002Fp>\n        <div style=\"display:flex;gap:16px\">\n          <span sc-camel-on-click=\"{{ goContact }}\" style=\"cursor:pointer;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.13em;text-transform:uppercase;background:oklch(0.74 0.13 62);color:#131517;padding:17px 30px\" style-hover=\"background:oklch(0.82 0.12 62)\">Discuss Your Project<\u002Fspan>\n          <span sc-camel-on-click=\"{{ goWork }}\" style=\"cursor:pointer;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.13em;text-transform:uppercase;border:1px solid #4a5158;color:#f4f1ec;padding:17px 30px\" style-hover=\"border-color:#f4f1ec\">View Our Work<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:100px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:64px;align-items:start\">\n        <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(30px,4vw,46px);line-height:1.1;margin:0;text-transform:uppercase\">Not a collision shop.<br>Not a general repair shop.<\u002Fh2>\n        <div>\n          <p style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin:0 0 22px\">Our work is limited to one thing: domestic American cars and trucks, primarily from the 1950s, '60s and '70s. Complete restorations, restomods, major system programs and the focused improvements that make an old vehicle genuinely usable.<\u002Fp>\n          <p style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin:0\">We don't chase insurance work, we don't service imports, and we don't sell a full build to an owner who needs a brake conversion and a cooling fix.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:100px 40px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:44px\">\n          <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(28px,3.5vw,40px);margin:0;text-transform:uppercase;letter-spacing:0.01em\">Featured Projects<\u002Fh2>\n          <span sc-camel-on-click=\"{{ goWork }}\" style=\"cursor:pointer;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:oklch(0.78 0.12 62)\">All projects →<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:28px\">\n          <sc-for list=\"{{ featured }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ p.open }}\" style=\"cursor:pointer;background:#1b1e21;border:1px solid #262a2e\" style-hover=\"border-color:#4a5158\">\n              <div style=\"aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#24272a 0 8px,#1c1f22 8px 16px);display:flex;align-items:center;justify-content:center;padding:16px\">\n                <span style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.16em;color:#5c6469;text-align:center;text-transform:uppercase\">{{ p.photo }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:26px 24px 30px\">\n                <div style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:12px\">{{ p.type }}<\u002Fdiv>\n                <h3 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:23px;margin:0 0 10px;text-transform:uppercase\">{{ p.name }}<\u002Fh3>\n                <p style=\"font-size:16px;line-height:1.55;color:#a9a29a;margin:0\">{{ p.outcome }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:100px 40px\">\n        <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(28px,3.5vw,40px);margin:0 0 44px;text-transform:uppercase\">From focused improvements to complete builds<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1px;background:#262a2e;border:1px solid #262a2e\">\n          <sc-for list=\"{{ coreServices }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ goServices }}\" style=\"cursor:pointer;background:#171a1c;padding:34px 30px 38px\" style-hover=\"background:#1d2124\">\n              <div style=\"font-family:ui-monospace,monospace;font-size:11px;color:#5c6469;margin-bottom:20px\">{{ s.num }}<\u002Fdiv>\n              <h3 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:21px;margin:0 0 12px;text-transform:uppercase\">{{ s.name }}<\u002Fh3>\n              <p style=\"font-size:16px;line-height:1.55;color:#a9a29a;margin:0\">{{ s.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:100px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:64px;align-items:center\">\n        <div style=\"aspect-ratio:5/4;background:repeating-linear-gradient(135deg,#24272a 0 8px,#1c1f22 8px 16px);display:flex;align-items:center;justify-content:center;padding:20px\">\n          <span style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.16em;color:#5c6469;text-align:center;text-transform:uppercase\">driving shot — finished car on a two-lane road<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(28px,3.5vw,40px);margin:0 0 20px;text-transform:uppercase\">The driving experience is the point<\u002Fh2>\n          <p style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin:0 0 34px\">A restoration is finished when the car earns its keys. Every system we touch is judged on the road, not on the lift.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#262a2e;border:1px solid #262a2e\">\n            <sc-for list=\"{{ drivingPoints }}\" as=\"d\" hint-placeholder-count=\"6\">\n              <div style=\"background:#131517;padding:22px 20px\">\n                <div style=\"font-family:'Oswald',sans-serif;font-size:17px;text-transform:uppercase;margin-bottom:6px\">{{ d.title }}<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.5;color:#a9a29a\">{{ d.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:100px 40px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:44px\">\n          <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(28px,3.5vw,40px);margin:0;text-transform:uppercase\">How a project runs<\u002Fh2>\n          <span sc-camel-on-click=\"{{ goProcess }}\" style=\"cursor:pointer;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:oklch(0.78 0.12 62)\">Full process →<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:28px\">\n          <sc-for list=\"{{ shortProcess }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <div style=\"border-top:2px solid oklch(0.74 0.13 62);padding-top:20px\">\n              <div style=\"font-family:ui-monospace,monospace;font-size:11px;color:#5c6469;margin-bottom:14px\">{{ s.num }}<\u002Fdiv>\n              <h3 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:20px;margin:0 0 10px;text-transform:uppercase\">{{ s.name }}<\u002Fh3>\n              <p style=\"font-size:15px;line-height:1.55;color:#a9a29a;margin:0\">{{ s.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:100px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px\">\n        <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(28px,3.5vw,40px);margin:0;text-transform:uppercase\">Why owners bring us their cars<\u002Fh2>\n        <div style=\"display:grid;gap:1px;background:#262a2e;border-top:1px solid #262a2e;border-bottom:1px solid #262a2e\">\n          <sc-for list=\"{{ differentiators }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <div style=\"background:#131517;padding:24px 0;display:grid;grid-template-columns:0.6fr 1fr;gap:32px\">\n              <div style=\"font-family:'Oswald',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:0.02em\">{{ d.title }}<\u002Fdiv>\n              <div style=\"font-size:16px;line-height:1.6;color:#a9a29a\">{{ d.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1000px;margin:0 auto;padding:100px 40px;text-align:center\">\n        <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:32px\">Customer proof<\u002Fdiv>\n        <blockquote style=\"font-family:'Oswald',sans-serif;font-weight:400;font-size:32px;line-height:1.35;margin:0;text-wrap:pretty\">“They found the wiring problem three shops had missed, told me what it would cost before they touched it, and sent photos every week. The car starts on the first crank and I've driven it to Chattanooga twice since.”<\u002Fblockquote>\n        <div style=\"margin-top:32px;font-size:16px;color:#a9a29a\">Dale W. — 1969 Chevrolet Chevelle · Milton, GA<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:100px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:64px;align-items:start\">\n        <div style=\"aspect-ratio:4/5;background:repeating-linear-gradient(135deg,#24272a 0 8px,#1c1f22 8px 16px);display:flex;align-items:center;justify-content:center;padding:20px\">\n          <span style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.16em;color:#5c6469;text-align:center;text-transform:uppercase\">portrait — Dave Caffey in the shop<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:20px\">Owner<\u002Fdiv>\n          <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(28px,3.5vw,40px);margin:0 0 22px;text-transform:uppercase\">Dave Caffey<\u002Fh2>\n          <p style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin:0 0 22px\">Fifty years in the automotive industry, beginning with a barely drivable 1954 Ford at age fifteen — two years disassembling and rebuilding it before he was old enough to drive it.<\u002Fp>\n          <p style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin:0 0 32px\">Since founding Contemporary Auto Restoration in 2012, he has grown it from a one-man, 1,400-square-foot operation into a 10,000-square-foot restoration facility.<\u002Fp>\n          <div style=\"border-left:2px solid oklch(0.74 0.13 62);padding-left:26px;margin-bottom:34px\">\n            <p style=\"font-family:'Oswald',sans-serif;font-weight:400;font-size:25px;line-height:1.4;margin:0\">“You have to be smarter than what you're working on.”<\u002Fp>\n          <\u002Fdiv>\n          <span sc-camel-on-click=\"{{ goAbout }}\" style=\"cursor:pointer;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:oklch(0.78 0.12 62)\">More about Dave →<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ SERVICES ============ -->\n  <sc-if value=\"{{ isServices }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:96px 40px 80px\">\n        <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:22px\">Capabilities<\u002Fdiv>\n        <h1 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(34px,5.2vw,60px);line-height:1.05;margin:0;max-width:20ch;text-transform:uppercase\">Every system, judged as one vehicle<\u002Fh1>\n        <p style=\"font-size:20px;line-height:1.6;color:#c3bdb5;max-width:62ch;margin:26px 0 0\">Engine, chassis, brakes, wiring and cooling are not separate jobs. We scope them as an integrated package so the finished car is balanced, serviceable and dependable.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:90px 40px\">\n        <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:34px;margin:0 0 36px;text-transform:uppercase\">Three project levels<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:28px\">\n          <sc-for list=\"{{ levels }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <div style=\"border:1px solid #262a2e;padding:34px 30px 38px;background:#1b1e21\">\n              <h3 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:24px;margin:0 0 14px;text-transform:uppercase\">{{ l.name }}<\u002Fh3>\n              <p style=\"font-size:16px;line-height:1.6;color:#a9a29a;margin:0 0 20px\">{{ l.desc }}<\u002Fp>\n              <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.78 0.12 62)\">{{ l.tag }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:90px 40px\">\n        <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:34px;margin:0 0 40px;text-transform:uppercase\">Service categories<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1px;background:#262a2e;border:1px solid #262a2e\">\n          <sc-for list=\"{{ allServices }}\" as=\"s\" hint-placeholder-count=\"10\">\n            <div style=\"background:#171a1c;padding:32px 30px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start\">\n              <div style=\"font-family:ui-monospace,monospace;font-size:11px;color:#5c6469;padding-top:5px\">{{ s.num }}<\u002Fdiv>\n              <div>\n                <h3 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:21px;margin:0 0 10px;text-transform:uppercase\">{{ s.name }}<\u002Fh3>\n                <p style=\"font-size:16px;line-height:1.6;color:#a9a29a;margin:0\">{{ s.desc }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ OUR WORK ============ -->\n  <sc-if value=\"{{ isWork }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:96px 40px 80px\">\n        <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:22px\">Projects<\u002Fdiv>\n        <h1 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(34px,5.2vw,60px);line-height:1.05;margin:0;text-transform:uppercase\">Completed work, explained<\u002Fh1>\n        <p style=\"font-size:20px;line-height:1.6;color:#c3bdb5;max-width:62ch;margin:26px 0 0\">Each project below documents what the owner wanted, what the car needed, what we changed and how it drives now.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section>\n      <div style=\"max-width:1280px;margin:0 auto;padding:56px 40px 100px\">\n        <div style=\"display:flex;gap:10px;margin-bottom:40px;flex-wrap:wrap\">\n          <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <span sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:28px\">\n          <sc-for list=\"{{ visibleProjects }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ p.open }}\" style=\"cursor:pointer;background:#1b1e21;border:1px solid #262a2e\" style-hover=\"border-color:#4a5158\">\n              <div style=\"aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#24272a 0 8px,#1c1f22 8px 16px);display:flex;align-items:center;justify-content:center;padding:16px\">\n                <span style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.16em;color:#5c6469;text-align:center;text-transform:uppercase\">{{ p.photo }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:26px 24px 30px\">\n                <div style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:12px\">{{ p.type }}<\u002Fdiv>\n                <h3 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:23px;margin:0 0 10px;text-transform:uppercase\">{{ p.name }}<\u002Fh3>\n                <p style=\"font-size:16px;line-height:1.55;color:#a9a29a;margin:0\">{{ p.outcome }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ PROJECT DETAIL ============ -->\n  <sc-if value=\"{{ isProject }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"position:relative;height:62vh;min-height:460px;display:flex;align-items:flex-end;background:repeating-linear-gradient(135deg,#1d2023 0 10px,#191c1f 10px 20px)\">\n      <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center\">\n        <span style=\"font-family:ui-monospace,monospace;font-size:12px;letter-spacing:0.2em;color:#5c6469;text-transform:uppercase\">{{ project.photo }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:absolute;inset:0;background:linear-gradient(to top,rgba(19,21,23,0.96) 5%,rgba(19,21,23,0.2) 70%)\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:1280px;margin:0 auto;padding:0 40px 64px;width:100%\">\n        <span sc-camel-on-click=\"{{ goWork }}\" style=\"cursor:pointer;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:oklch(0.78 0.12 62)\">← All projects<\u002Fspan>\n        <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#a9a29a;margin:26px 0 14px\">{{ project.type }}<\u002Fdiv>\n        <h1 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(34px,5.4vw,64px);line-height:1.02;margin:0;text-transform:uppercase\">{{ project.name }}<\u002Fh1>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:80px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:64px\">\n        <div>\n          <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:18px\">Owner's objective<\u002Fdiv>\n          <p style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin:0\">{{ project.objective }}<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:18px\">Starting point<\u002Fdiv>\n          <p style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin:0\">{{ project.start }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:80px 40px\">\n        <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:34px;margin:0 0 36px;text-transform:uppercase\">Scope of work<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1px;background:#262a2e;border:1px solid #262a2e\">\n          <sc-for list=\"{{ project.scope }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div style=\"background:#171a1c;padding:28px 30px\">\n              <div style=\"font-family:'Oswald',sans-serif;font-size:17px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px\">{{ s.area }}<\u002Fdiv>\n              <div style=\"font-size:16px;line-height:1.6;color:#a9a29a\">{{ s.detail }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:80px 40px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:64px;margin-bottom:56px\">\n          <div>\n            <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:34px;margin:0 0 18px;text-transform:uppercase\">Decisions and solutions<\u002Fh2>\n            <p style=\"font-size:18px;line-height:1.65;color:#c3bdb5;margin:0\">{{ project.decisions }}<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:34px;margin:0 0 18px;text-transform:uppercase\">The result<\u002Fh2>\n            <p style=\"font-size:18px;line-height:1.65;color:#c3bdb5;margin:0\">{{ project.result }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px\">\n          <sc-for list=\"{{ project.gallery }}\" as=\"g\" hint-placeholder-count=\"8\">\n            <div style=\"aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#24272a 0 8px,#1c1f22 8px 16px);display:flex;align-items:center;justify-content:center;padding:12px\">\n              <span style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.14em;color:#5c6469;text-align:center;text-transform:uppercase\">{{ g }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1000px;margin:0 auto;padding:88px 40px;text-align:center\">\n        <blockquote style=\"font-family:'Oswald',sans-serif;font-weight:400;font-size:29px;line-height:1.4;margin:0\">{{ project.quote }}<\u002Fblockquote>\n        <div style=\"margin-top:26px;font-size:16px;color:#a9a29a\">{{ project.quoteBy }}<\u002Fdiv>\n        <span sc-camel-on-click=\"{{ goContact }}\" style=\"cursor:pointer;display:inline-block;margin-top:40px;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.13em;text-transform:uppercase;background:oklch(0.74 0.13 62);color:#131517;padding:17px 30px\">Have a similar project? Let's discuss it<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ PROCESS ============ -->\n  <sc-if value=\"{{ isProcess }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:96px 40px 80px\">\n        <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:22px\">Method<\u002Fdiv>\n        <h1 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(34px,5.2vw,60px);line-height:1.05;margin:0;text-transform:uppercase\">Ten steps, no surprises<\u002Fh1>\n        <p style=\"font-size:20px;line-height:1.6;color:#c3bdb5;max-width:62ch;margin:26px 0 0\">How a project is evaluated, scoped, approved, documented, completed, tested and delivered.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1000px;margin:0 auto;padding:80px 40px\">\n        <sc-for list=\"{{ fullProcess }}\" as=\"s\" hint-placeholder-count=\"10\">\n          <div style=\"display:grid;grid-template-columns:80px 1fr;gap:32px;padding:30px 0;border-bottom:1px solid #262a2e\">\n            <div style=\"font-family:'Oswald',sans-serif;font-size:34px;color:#3c4348;line-height:1\">{{ s.num }}<\u002Fdiv>\n            <div>\n              <h3 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:23px;margin:0 0 10px;text-transform:uppercase\">{{ s.name }}<\u002Fh3>\n              <p style=\"font-size:17px;line-height:1.6;color:#a9a29a;margin:0\">{{ s.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1000px;margin:0 auto;padding:80px 40px\">\n        <div style=\"border-left:2px solid oklch(0.74 0.13 62);padding-left:32px\">\n          <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:18px\">On discoveries<\u002Fdiv>\n          <p style=\"font-family:'Oswald',sans-serif;font-weight:400;font-size:26px;line-height:1.45;margin:0\">Restoration projects can reveal conditions that are not visible during an initial inspection. When new issues materially affect the approved scope, we document what we find, explain the options and obtain authorization before proceeding.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:80px 40px\">\n        <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:34px;margin:0 0 36px;text-transform:uppercase\">Common questions<\u002Fh2>\n        <div style=\"display:grid;gap:1px;background:#262a2e;border-top:1px solid #262a2e;border-bottom:1px solid #262a2e\">\n          <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ f.toggle }}\" style=\"background:#131517;padding:26px 0;cursor:pointer\">\n              <div style=\"display:flex;justify-content:space-between;gap:32px;align-items:baseline\">\n                <h3 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:21px;margin:0;text-transform:uppercase\">{{ f.q }}<\u002Fh3>\n                <span style=\"font-family:ui-monospace,monospace;font-size:16px;color:oklch(0.78 0.12 62)\">{{ f.sign }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"font-size:17px;line-height:1.65;color:#a9a29a;margin:16px 0 0;max-width:80ch\">{{ f.a }}<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ ABOUT ============ -->\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:96px 40px 80px\">\n        <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:22px\">People &amp; standards<\u002Fdiv>\n        <h1 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(34px,5.2vw,60px);line-height:1.05;margin:0;max-width:18ch;text-transform:uppercase\">A shop built around American classics<\u002Fh1>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:80px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:64px;align-items:start\">\n        <div>\n          <p style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin:0 0 22px\">Contemporary Auto Restoration works on domestic cars and trucks from the 1950s, '60s and '70s — the vehicles our team grew up with and has spent careers understanding. We are not a collision center and we are not a general repair garage.<\u002Fp>\n          <p style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin:0 0 22px\">Most of what arrives here has been worked on before, sometimes well and sometimes not. We start by understanding the vehicle and what the owner actually wants from it, then scope the work honestly — including the parts we'd recommend leaving alone.<\u002Fp>\n          <p style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin:0\">The shop opened in 2012 as a one-man, 1,400-square-foot operation and works today out of a 10,000-square-foot facility. The standard hasn't changed: it has to look right, work properly, and be enjoyable to drive years after it leaves.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#24272a 0 8px,#1c1f22 8px 16px);display:flex;align-items:center;justify-content:center;padding:20px\">\n          <span style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.16em;color:#5c6469;text-align:center;text-transform:uppercase\">facility photo — main bay, cars under work<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:80px 40px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:64px;align-items:start\">\n          <div style=\"aspect-ratio:4/5;background:repeating-linear-gradient(135deg,#24272a 0 8px,#1c1f22 8px 16px);display:flex;align-items:center;justify-content:center;padding:20px\">\n            <span style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.16em;color:#5c6469;text-align:center;text-transform:uppercase\">portrait — Dave Caffey in the shop<\u002Fspan>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:20px\">Owner<\u002Fdiv>\n            <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(30px,4vw,44px);margin:0 0 26px;text-transform:uppercase\">Dave Caffey<\u002Fh2>\n            <sc-for list=\"{{ ownerStory }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <p style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin:0 0 22px\">{{ p }}<\u002Fp>\n            <\u002Fsc-for>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:#262a2e;border:1px solid #262a2e;margin:34px 0\">\n              <sc-for list=\"{{ ownerFacts }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div style=\"background:#171a1c;padding:22px 20px\">\n                  <div style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#a9a29a;margin-bottom:8px\">{{ f.k }}<\u002Fdiv>\n                  <div style=\"font-family:'Oswald',sans-serif;font-size:20px;text-transform:uppercase\">{{ f.v }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border-left:2px solid oklch(0.74 0.13 62);padding-left:26px\">\n              <div style=\"font-size:19px;line-height:1.65;color:#c3bdb5;margin-bottom:18px\">For Dave, exceptional restoration work comes down to craftsmanship, problem-solving, and trust — all guided by a philosophy he has carried throughout his career:<\u002Fdiv>\n              <p style=\"font-family:'Oswald',sans-serif;font-weight:400;font-size:26px;line-height:1.4;margin:0\">“You have to be smarter than what you're working on.”<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"border-bottom:1px solid #262a2e\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:80px 40px\">\n        <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:34px;margin:0 0 36px;text-transform:uppercase\">How we work with owners<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1px;background:#262a2e;border:1px solid #262a2e\">\n          <sc-for list=\"{{ standards }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div style=\"background:#131517;padding:30px 28px\">\n              <h3 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:19px;margin:0 0 10px;text-transform:uppercase\">{{ s.title }}<\u002Fh3>\n              <p style=\"font-size:16px;line-height:1.6;color:#a9a29a;margin:0\">{{ s.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ CONTACT ============ -->\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"border-bottom:1px solid #262a2e;background:#171a1c\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:96px 40px 80px\">\n        <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.78 0.12 62);margin-bottom:22px\">Project inquiry<\u002Fdiv>\n        <h1 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(34px,5.2vw,60px);line-height:1.05;margin:0;text-transform:uppercase\">Tell us about your car<\u002Fh1>\n        <p style=\"font-size:20px;line-height:1.6;color:#c3bdb5;max-width:64ch;margin:26px 0 0\">Complex restoration work requires inspection and discovery before a reliable scope can be established — so this isn't a quote form. The more you tell us, the more useful our first conversation will be.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section>\n      <div style=\"max-width:1280px;margin:0 auto;padding:72px 40px 100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:56px;align-items:start\">\n        <form sc-camel-on-submit=\"{{ submit }}\" style=\"display:grid;gap:44px\">\n          <sc-for list=\"{{ formGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div>\n              <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:22px;border-bottom:1px solid #262a2e;padding-bottom:12px\">\n                <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#5c6469\">{{ g.num }}<\u002Fspan>\n                <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:22px;margin:0;text-transform:uppercase\">{{ g.title }}<\u002Fh2>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\">\n                <sc-for list=\"{{ g.fields }}\" as=\"f\" hint-placeholder-count=\"6\">\n                  <label style=\"{{ f.wrapStyle }}\">\n                    <span style=\"display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#a9a29a;margin-bottom:8px\">{{ f.label }}<\u002Fspan>\n                    <input type=\"text\" placeholder=\"{{ f.hint }}\" style=\"width:100%;background:#1b1e21;border:1px solid #2e3338;color:#f4f1ec;font-family:'Source Sans 3',sans-serif;font-size:16px;padding:13px 14px;outline:none\" style-focus=\"border-color:oklch(0.74 0.13 62)\">\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div>\n            <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:22px;border-bottom:1px solid #262a2e;padding-bottom:12px\">\n              <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#5c6469\">04<\u002Fspan>\n              <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:22px;margin:0;text-transform:uppercase\">What would make this project successful for you?<\u002Fh2>\n            <\u002Fdiv>\n            <textarea rows=\"5\" placeholder=\"Desired outcome, known problems, previous work, timing.\" style=\"width:100%;background:#1b1e21;border:1px solid #2e3338;color:#f4f1ec;font-family:'Source Sans 3',sans-serif;font-size:16px;padding:13px 14px;outline:none;resize:vertical\" style-focus=\"border-color:oklch(0.74 0.13 62)\"><\u002Ftextarea>\n            <div style=\"margin-top:18px;border:1px dashed #3a4046;padding:22px;display:flex;align-items:center;justify-content:space-between;gap:20px\">\n              <span style=\"font-size:15px;color:#a9a29a\">Attach vehicle photographs, inspection reports, build sheets or prior invoices.<\u002Fspan>\n              <span style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.78 0.12 62);white-space:nowrap\">Choose files<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:24px\">\n            <button type=\"submit\" style=\"cursor:pointer;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.13em;text-transform:uppercase;background:oklch(0.74 0.13 62);color:#131517;padding:18px 34px;border:none\" style-hover=\"background:oklch(0.82 0.12 62)\">Submit My Project<\u002Fbutton>\n            <span style=\"font-size:15px;color:#a9a29a\">{{ submitNote }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fform>\n        <aside style=\"border:1px solid #262a2e;background:#1b1e21;padding:34px 32px\">\n          <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:22px;margin:0 0 24px;text-transform:uppercase\">The shop<\u002Fh2>\n          <div style=\"display:grid;gap:20px;font-size:16px;line-height:1.6;color:#c3bdb5\">\n            <div>\n              <div style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#a9a29a;margin-bottom:6px\">Address<\u002Fdiv>\n              <div>1140 Industrial Way<br>Alpharetta, GA 30004<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#a9a29a;margin-bottom:6px\">Telephone<\u002Fdiv>\n              <a href=\"tel:6785550142\">678 · 555 · 0142<\u002Fa>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#a9a29a;margin-bottom:6px\">Email<\u002Fdiv>\n              <a href=\"mailto:shop@contempauto.com\">shop@contempauto.com<\u002Fa>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#a9a29a;margin-bottom:6px\">Hours<\u002Fdiv>\n              <div>Monday–Friday, 8:00–5:30<br>Saturday by appointment<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#a9a29a;margin-bottom:6px\">Service area<\u002Fdiv>\n              <div>Alpharetta, Roswell, Milton, Johns Creek, Cumming, Marietta and Woodstock. Regional and nationwide projects accepted, with transport arranged.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:28px;aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#24272a 0 8px,#1c1f22 8px 16px);display:flex;align-items:center;justify-content:center;padding:14px\">\n            <span style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.16em;color:#5c6469;text-align:center;text-transform:uppercase\">map / shop exterior<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <section style=\"background:#171a1c;border-top:1px solid #262a2e\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:96px 40px;display:flex;justify-content:space-between;align-items:center;gap:48px;flex-wrap:wrap\">\n      <h2 style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(30px,3.8vw,44px);margin:0;text-transform:uppercase;max-width:18ch\">Serving Alpharetta, North Atlanta and owners nationwide<\u002Fh2>\n      <span sc-camel-on-click=\"{{ goContact }}\" style=\"cursor:pointer;white-space:nowrap;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.13em;text-transform:uppercase;background:oklch(0.74 0.13 62);color:#131517;padding:19px 34px\" style-hover=\"background:oklch(0.82 0.12 62)\">Tell us about your car<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid #262a2e\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:56px 40px;display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap\">\n      <div>\n        <div style=\"font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;letter-spacing:0.16em;text-transform:uppercase\">Contemporary Auto Restoration<\u002Fdiv>\n        <div style=\"font-size:15px;color:#a9a29a;margin-top:10px\">1140 Industrial Way, Alpharetta, GA 30004 · 678 · 555 · 0142<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:28px;align-items:center\">\n        <sc-for list=\"{{ nav }}\" as=\"item\" hint-placeholder-count=\"6\">\n          <span sc-camel-on-click=\"{{ item.go }}\" style=\"cursor:pointer;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#a9a29a\">{{ item.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst PROJECTS = [\n  { id: \"chevelle\", name: \"1969 Chevrolet Chevelle\", type: \"Restomod · Drivetrain · Chassis\", cat: \"Restomod\",\n    outcome: \"LS swap and full chassis package; a 3,600-mile first summer.\",\n    photo: \"hero — chevelle, three-quarter front\",\n    objective: \"A driver, not a trailer queen. The owner wanted the stance and the SS look preserved while gaining highway manners, air conditioning and brakes he could trust in Atlanta traffic.\",\n    start: \"Solid body from a 2011 repaint, but the car ran hot, wandered above 50 mph and had two generations of add-on wiring stacked behind the dash.\",\n    decisions: \"We chose a proven LS3 and 4L65E combination over a period-correct big block because the owner's priority was daily usability. Suspension, brakes and steering were quoted as one package so the geometry and pedal feel would match the new power.\",\n    result: \"Starts on the first crank hot or cold, runs 195°F in traffic with air conditioning on, tracks straight at highway speed and stops without drama.\",\n    scope: [\n      { area: \"Engine\", detail: \"LS3 with new accessory drive, tuned fuel and spark, converted to electronic fuel injection with a return-style system.\" },\n      { area: \"Drivetrain\", detail: \"4L65E automatic with overdrive, custom crossmember and driveshaft, rebuilt 12-bolt with 3.42 gears.\" },\n      { area: \"Chassis\", detail: \"Tubular upper and lower control arms, coilovers, boxed rear trailing arms and a rear sway bar.\" },\n      { area: \"Brakes & steering\", detail: \"Four-wheel discs with a hydroboost setup and a quick-ratio power steering box.\" },\n      { area: \"Electrical\", detail: \"Complete new harness, modern fuse block, relayed headlights, LED taillights and updated gauges.\" },\n      { area: \"Cooling & climate\", detail: \"Aluminum radiator, dual electric fans on a controller, and a modern under-dash air conditioning system.\" }\n    ],\n    gallery: [\"arrival — as delivered\", \"disassembly — engine bay\", \"fabrication — crossmember\", \"wiring — dash out\", \"installation — coilovers\", \"detail — engine bay finished\", \"interior — finished\", \"driving — road test\"],\n    quote: \"“They found the wiring problem three shops had missed, told me what it would cost before they touched it, and sent photos every week.”\",\n    quoteBy: \"Dale W. — Milton, GA\" },\n  { id: \"f100\", name: \"1966 Ford F-100\", type: \"Complete Restoration · Truck Program\", cat: \"Complete Build\",\n    outcome: \"Ground-up restoration with a modern drivetrain under an original-spec cab.\",\n    photo: \"hero — f-100, shop floor, finished\",\n    objective: \"The owner's father bought the truck new. The brief was to keep it looking exactly as remembered while making it safe and comfortable enough for weekend use.\",\n    start: \"Original drivetrain, tired throughout, with cab corner and floor rust hidden under a previous cosmetic repair.\",\n    decisions: \"Sheet metal was repaired rather than replaced wherever the original panels could be saved. Modern hardware — brakes, steering, cooling — was chosen for parts that stay out of sight.\",\n    result: \"Looks period-correct at ten feet and at ten inches, but stops, steers and cools like a vehicle built this decade.\",\n    scope: [\n      { area: \"Body\", detail: \"Cab corners, floors and lower fenders repaired; full strip and refinish in the original color.\" },\n      { area: \"Engine\", detail: \"Rebuilt 352 FE with modern seals, ignition and a corrected fuel delivery system.\" },\n      { area: \"Drivetrain\", detail: \"Overdrive automatic conversion with a rebuilt rear end for highway gearing.\" },\n      { area: \"Chassis\", detail: \"Front disc brake conversion, new steering box, bushings and shocks throughout.\" },\n      { area: \"Electrical\", detail: \"New harness, alternator conversion, correct-appearance gauges with modern internals.\" },\n      { area: \"Interior\", detail: \"Original-pattern bench upholstery, insulation, and a hidden audio system.\" }\n    ],\n    gallery: [\"arrival — as delivered\", \"teardown — cab off\", \"rust repair — floors\", \"paint — body in booth\", \"engine — rebuilt 352\", \"assembly — chassis\", \"interior — bench installed\", \"finished — three-quarter rear\"],\n    quote: \"“It looks the way it did when my dad drove it, and it finally drives the way I hoped it would.”\",\n    quoteBy: \"Rick M. — Cumming, GA\" },\n  { id: \"mustang\", name: \"1967 Ford Mustang Fastback\", type: \"Major System Project · Electrical\", cat: \"Major System\",\n    outcome: \"Wiring, charging and fuel systems corrected after a failed prior build.\",\n    photo: \"hero — mustang fastback, front angle\",\n    objective: \"The car had been 'finished' elsewhere and was undriveable. The owner wanted a reliable car, not another cosmetic pass.\",\n    start: \"Spliced harness, undersized charging system, fuel starvation above half throttle and a persistent hot-start problem.\",\n    decisions: \"Rather than chase faults, we removed the existing harness entirely and rebuilt the electrical and fuel systems as designed assemblies with documentation the owner keeps.\",\n    result: \"Hot-start issue gone, headlights hold voltage at idle, and the car pulls cleanly to redline without stumble.\",\n    scope: [\n      { area: \"Electrical\", detail: \"Complete new harness, modern fuse panel, relayed lighting and a properly sized alternator.\" },\n      { area: \"Fuel\", detail: \"New tank, sending unit, lines and regulated pump with correct return routing.\" },\n      { area: \"Engine\", detail: \"Ignition system replaced, timing and carburetion corrected, heat-soak addressed.\" },\n      { area: \"Cooling\", detail: \"Radiator, shroud and fan corrected for airflow at idle.\" },\n      { area: \"Interior\", detail: \"Gauge cluster rebuilt with accurate senders.\" },\n      { area: \"Testing\", detail: \"300-mile road validation including hot restarts and sustained highway running.\" }\n    ],\n    gallery: [\"arrival — as delivered\", \"old harness removed\", \"new harness — bench built\", \"fuse panel installed\", \"fuel system — tank out\", \"gauges — rebuilt\", \"engine bay — finished\", \"road test\"],\n    quote: \"“Two years of frustration, solved in six weeks and fully documented.”\",\n    quoteBy: \"Steven A. — Johns Creek, GA\" },\n  { id: \"c10\", name: \"1972 Chevrolet C10\", type: \"Restomod · Truck Program\", cat: \"Restomod\",\n    outcome: \"Lowered, air-conditioned and drivable every week of the year.\",\n    photo: \"hero — c10, low angle\",\n    objective: \"A comfortable weekly driver with modern climate control and a lowered stance, without turning the truck into a show piece.\",\n    start: \"Running but rough: worn front end, marginal brakes and no functional air conditioning.\",\n    decisions: \"Drop spindles and rear flip kit were selected over an air system to keep maintenance simple and ride quality predictable.\",\n    result: \"Sits right, rides better than stock, and holds cabin temperature in July traffic.\",\n    scope: [\n      { area: \"Chassis\", detail: \"Drop spindles, rear flip kit, new bushings, shocks and alignment.\" },\n      { area: \"Brakes\", detail: \"Front and rear disc conversion with a proportioning valve set to the new package.\" },\n      { area: \"Engine\", detail: \"350 refresh with electronic ignition and a corrected cooling package.\" },\n      { area: \"Climate\", detail: \"Complete modern air conditioning with under-dash controls.\" },\n      { area: \"Electrical\", detail: \"Charging upgrade, new grounds, LED lighting.\" },\n      { area: \"Interior\", detail: \"Insulation, new carpet, seat rebuild and a discreet audio installation.\" }\n    ],\n    gallery: [\"arrival\", \"front end apart\", \"rear flip kit install\", \"brake conversion\", \"a/c installation\", \"interior — insulation\", \"finished — profile\", \"driving\"],\n    quote: \"“It's the truck I drive when I could take either car.”\",\n    quoteBy: \"Bill T. — Roswell, GA\" },\n  { id: \"charger\", name: \"1970 Dodge Charger\", type: \"Complete Build · Drivetrain\",\n    cat: \"Complete Build\",\n    outcome: \"Ground-up build finished to a documented, owner-approved scope.\",\n    photo: \"hero — charger, front three-quarter\",\n    objective: \"A comprehensive build with period character and modern reliability, documented well enough to support a future sale.\",\n    start: \"Long-term storage car, complete but requiring structural repair and full mechanical rebuild.\",\n    decisions: \"Original-style appearance was preserved while every wear system underneath was replaced with proven, serviceable components.\",\n    result: \"Idles cleanly, cools under load, and delivers the character the owner wanted without the maintenance it used to demand.\",\n    scope: [\n      { area: \"Body\", detail: \"Structural repair, panel alignment, strip and refinish.\" },\n      { area: \"Engine\", detail: \"Rebuilt big block with modern internals, ignition and induction.\" },\n      { area: \"Drivetrain\", detail: \"Rebuilt transmission and rear end with revised gearing.\" },\n      { area: \"Chassis\", detail: \"Full front end rebuild, torsion bars, upgraded brakes.\" },\n      { area: \"Electrical\", detail: \"New harness throughout with modern protection.\" },\n      { area: \"Interior\", detail: \"Full interior restoration with correct materials.\" }\n    ],\n    gallery: [\"arrival\", \"body on rotisserie\", \"structural repair\", \"paint\", \"engine build\", \"assembly\", \"interior finished\", \"completed car\"],\n    quote: \"“Every invoice matched a photograph. I knew exactly what I was paying for.”\",\n    quoteBy: \"Marcus L. — Marietta, GA\" },\n  { id: \"camaro\", name: \"1968 Chevrolet Camaro\", type: \"Focused Improvement · Cooling & Brakes\",\n    cat: \"Focused Improvement\",\n    outcome: \"Two persistent problems solved in three weeks, no full build required.\",\n    photo: \"hero — camaro, engine bay detail\",\n    objective: \"The owner liked the car as it was. He wanted it to stop overheating in traffic and to brake without pulling.\",\n    start: \"A well-sorted car with an undersized cooling package and a mismatched front brake setup from a prior owner.\",\n    decisions: \"We scoped only the two systems in question and told the owner what not to spend money on — a recommendation that removed roughly a third of the original estimate.\",\n    result: \"Holds temperature at idle in summer and brakes straight and flat.\",\n    scope: [\n      { area: \"Cooling\", detail: \"Correct-core radiator, shroud, electric fan and controller.\" },\n      { area: \"Brakes\", detail: \"Matched caliper and master cylinder package with a correct proportioning valve.\" },\n      { area: \"Testing\", detail: \"Repeat heat-soak testing and braking validation on the road.\" }\n    ],\n    gallery: [\"arrival\", \"cooling — old radiator out\", \"fan and shroud fitted\", \"brake components\", \"finished engine bay\", \"road test\"],\n    quote: \"“They talked me out of work I didn't need. That's why the next car is going there too.”\",\n    quoteBy: \"Pat H. — Woodstock, GA\" }\n];\n\nconst NAV = [\n  { id: \"home\", label: \"Home\" },\n  { id: \"services\", label: \"Services\" },\n  { id: \"work\", label: \"Our Work\" },\n  { id: \"process\", label: \"Our Process\" },\n  { id: \"about\", label: \"About\" },\n  { id: \"contact\", label: \"Contact\" }\n];\n\nconst FILTERS = [\"All Projects\", \"Complete Build\", \"Restomod\", \"Major System\", \"Focused Improvement\"];\n\nclass Component extends DCLogic {\n  state = { page: \"home\", projectId: null, filter: \"All Projects\", openFaq: 0, submitted: false };\n\n  go(page) {\n    this.setState({ page: page, projectId: null });\n    if (typeof window !== \"undefined\") window.scrollTo(0, 0);\n  }\n\n  openProject(id) {\n    this.setState({ page: \"project\", projectId: id });\n    if (typeof window !== \"undefined\") window.scrollTo(0, 0);\n  }\n\n  renderVals() {\n    const st = this.state;\n    const active = st.page === \"project\" ? \"work\" : st.page;\n    const baseNav = \"cursor:pointer;display:inline-block;white-space:nowrap;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.09em;text-transform:uppercase;padding-bottom:2px;\";\n    const nav = NAV.map(n => ({\n      label: n.label,\n      go: () => this.go(n.id),\n      style: baseNav + (active === n.id\n        ? \"color:#f4f1ec;border-bottom:2px solid oklch(0.74 0.13 62)\"\n        : \"color:#a9a29a;border-bottom:2px solid transparent\")\n    }));\n\n    const decorate = p => Object.assign({}, p, { open: () => this.openProject(p.id) });\n    const visible = (st.filter === \"All Projects\" ? PROJECTS : PROJECTS.filter(p => p.cat === st.filter)).map(decorate);\n\n    const filters = FILTERS.map(f => ({\n      label: f,\n      pick: () => this.setState({ filter: f }),\n      style: \"cursor:pointer;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:10px 16px;border:1px solid \" +\n        (st.filter === f ? \"oklch(0.74 0.13 62);background:oklch(0.74 0.13 62);color:#131517\" : \"#2e3338;color:#a9a29a\")\n    }));\n\n    const faqData = [\n      { q: \"What does a project cost?\", a: \"It depends entirely on the vehicle and the goal. Focused improvements are typically a few thousand dollars; major system projects run well into five figures; complete builds are six-figure programs. We give a scoped range after evaluation, not a number over the phone.\" },\n      { q: \"How long will my car be here?\", a: \"Focused improvements are usually two to six weeks. Major system projects run three to nine months. Complete builds are measured in years, and we schedule them so your car isn't sitting untouched.\" },\n      { q: \"Why don't you give free estimates?\", a: \"A reliable scope on a fifty-year-old vehicle requires inspection and, often, disassembly. A number given without that is a guess, and guesses become disputes later.\" },\n      { q: \"What happens when you find something unexpected?\", a: \"We photograph it, explain the options and the cost impact, and wait for your written authorization before proceeding. Nothing outside the approved scope gets billed.\" },\n      { q: \"Can I supply my own parts?\", a: \"Sometimes. We'll tell you honestly when a customer-supplied part will compromise the result or the warranty on surrounding work, and we don't warranty parts we didn't select.\" },\n      { q: \"Do you work on imports or newer cars?\", a: \"No. We work exclusively on domestic American cars and trucks, primarily from the 1950s, 1960s and 1970s.\" },\n      { q: \"I'm out of state — can that work?\", a: \"Yes. We handle nationwide projects regularly and arrange enclosed transport. Documentation and weekly photo updates matter more when you can't stop by.\" }\n    ];\n    const faqs = faqData.map((f, i) => ({\n      q: f.q, a: f.a,\n      open: st.openFaq === i,\n      sign: st.openFaq === i ? \"−\" : \"+\",\n      toggle: () => this.setState({ openFaq: st.openFaq === i ? -1 : i })\n    }));\n\n    return {\n      nav: nav,\n      isHome: st.page === \"home\",\n      isServices: st.page === \"services\",\n      isWork: st.page === \"work\",\n      isProject: st.page === \"project\",\n      isProcess: st.page === \"process\",\n      isAbout: st.page === \"about\",\n      isContact: st.page === \"contact\",\n      goHome: () => this.go(\"home\"),\n      goWork: () => this.go(\"work\"),\n      goServices: () => this.go(\"services\"),\n      goProcess: () => this.go(\"process\"),\n      goContact: () => this.go(\"contact\"),\n      goAbout: () => this.go(\"about\"),\n      featured: PROJECTS.slice(0, 3).map(decorate),\n      visibleProjects: visible,\n      filters: filters,\n      project: PROJECTS.find(p => p.id === st.projectId) || PROJECTS[0],\n      faqs: faqs,\n      submitNote: st.submitted ? \"Th lkaround and delivery\", desc: \"We go through every system with you in person, hand over documentation, and explain what needs attention and when.\" },\n        { num: \"10\", name: \"Post-completion support\", desc: \"Break-in checks, adjustments and a shop that knows your car when you call two years later.\" }\n      ],\n      ownerStory: [\n        \"Dave Caffey is the owner of Contemporary Auto Restoration in Alpharetta, Georgia, bringing more than five decades of experience in the automotive industry. His passion began at age 15, when his uncle gave him a barely drivable 1954 Ford. Too young to drive, Dave spent the next two years completely disassembling and rebuilding the car himself.\",\n        \"A 1971 graduate of Lincoln Technical Institute, Dave's career has spanned new-car dealerships, an IndyCar team, international automotive product development, specialty vehicle safety testing, and ownership of multiple automotive businesses.\",\n        \"Today, Dave specializes in restoring and modernizing classic American automobiles, blending modern performance, reliability, and technology with the character and originality that make these cars special. Under his leadership, Contemporary Auto Restoration has grown from a one-man, 1,400-square-foot operation into a 10,000-square-foot restoration facility.\"\n      ],\n      ownerFacts: [\n        { k: \"Years in the industry\", v: \"50+\" },\n        { k: \"First project\", v: \"1954 Ford, age 15\" },\n        { k: \"Training\", v: \"Lincoln Technical Institute, 1971\" },\n        { k: \"Shop founded\", v: \"2012, Alpharetta\" },\n        { k: \"Facility today\", v: \"10,000 sq ft\" }\n      ],\n      differentiators: [\n        { title: \"American classics only\", text: \"One focus, three decades deep — not a general shop that also takes restorations.\" },\n        { title: \"Systems thinking\", text: \"Power, brakes, steering and cooling are scoped together so the finished car is balanced.\" },\n        { title
